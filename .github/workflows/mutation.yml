name: mutation

# Nightly mutation-score floors (scripts/mutation-ci.mjs owns the per-module
# floors). Catches a change that guts a module's tests without breaking them.
#
# One job per module. The full set in sequence runs past the hour a job may
# live, so a single job never finished and scored nothing; the matrix comes
# from the script's own module list, so adding a floor shards it without
# touching this file.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  modules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "list=$(node scripts/mutation-ci.mjs --list)" >> "$GITHUB_OUTPUT"

  floors:
    needs: modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.list) }}
    name: floors (${{ matrix.module }})
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: node scripts/mutation-ci.mjs
        env:
          MUTATION_MODULES: ${{ matrix.module }}
